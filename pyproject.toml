[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classic-pattern-explorer"
version = "3.1"
description = "Pattern search and verification for Literary Sinitic source text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The GUI window (cpe gui): a native web view with an in-process bridge. Windows uses
# Edge WebView2 and macOS WebKit; Linux uses the Qt backend. Additional system
# libraries may be needed depending on the distribution and display backend.
dependencies = [
    "pywebview>=5; sys_platform != 'linux'",
    "pywebview[qt]>=5; sys_platform == 'linux'",
]

[project.scripts]
cpe = "cpe.cli:main"
cpe-mcp = "cpe.mcp.runner:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["cpe"]

[tool.hatch.build.targets.sdist]
include = [
    "/cpe",
    "/patterns",
    "/hatch_build.py",
    "/cpe-gui.command",
    "/cpe-gui.sh",
    "/itkc_search.py",
    "/pyproject.toml",
    "/uv.lock",
    "/LICENSE",
    "/README*.md",
    "/release.json",
    "/discoverability.md",
    "/docs/mcp.md",
    "/docs/mcp-parity.md",
    "/docs/mcp-dsl-classification.md",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
